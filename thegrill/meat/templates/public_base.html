{% extends "public_shell.html" %}
{% block shell %}
<section class="wrap inner">
  {% block public %}{% endblock %}

  <div class="card" style="margin-top:28px">
    <p class="muted" style="margin:0 0 6px">{{ t("common.language") }}</p>
    <div class="langbar">
      {% for code, l in languages.items() %}
        <a href="/idioma/{{ code }}?next={{ here }}" class="{{ 'on' if code == lang }}"
           hreflang="{{ code }}">{{ l.name }}</a>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
