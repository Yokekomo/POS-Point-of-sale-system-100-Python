{% extends "base.html" %}{% block title %}{{ t("signup.title") }}{% endblock %}
{% block body %}
<h1>{{ t("signup.title") }}</h1>
<p class="sub">{{ t("signup.sub") }}</p>
{% if error %}<div class="banner bad">{{ error }}</div>{% endif %}
<div class="card">
<form method="post" action="/signup">
  <label for="restaurant">{{ t("signup.restaurant_name") }}</label>
  <input id="restaurant" name="restaurant" required autofocus>
  <label for="name">{{ t("signup.your_name") }}</label>
  <input id="name" name="name" required>
  <label for="email">{{ t("signup.your_email") }}</label>
  <input id="email" name="email" type="email" required>
  <label for="password">{{ t("common.password") }} <span class="muted">({{ t("common.password_hint") }})</span></label>
  <input id="password" name="password" type="password" minlength="8" required>
  <label for="language">{{ t("common.language") }}</label>
  <select id="language" name="language">
    {% for code, l in languages.items() %}
      <option value="{{ code }}" {% if code == lang %}selected{% endif %}>{{ l.name }}</option>
    {% endfor %}
  </select>
  <div class="help">{{ t("settings.restaurant_language_help") }}</div>
  <button class="wide" type="submit">{{ t("signup.submit") }}</button>
</form>
</div>
<p class="muted"><a href="/login">{{ t("login.have_account") }}</a></p>
{% endblock %}
