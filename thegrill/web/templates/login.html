{% extends "base.html" %}{% block title %}Entrar{% endblock %}
{% block body %}
<h1>Entrar</h1>
<p class="sub">Gestión de cocina: registros, trazabilidad y control.</p>
{% if error %}<div class="banner bad">{{ error }}</div>{% endif %}
<div class="card">
<form method="post" action="/login">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="wide" type="submit">Entrar</button>
</form>
</div>
<div class="card">
  <p class="muted" style="margin:0 0 10px">¿Primera vez?</p>
  <div class="rowflex">
    <a class="btn ghost" href="/signup">Dar de alta mi restaurante</a>
    <a class="btn ghost" href="/join">Unirme con un código</a>
  </div>
</div>
{% endblock %}
