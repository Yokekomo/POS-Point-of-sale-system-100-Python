<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Gestión de cocina{% endblock %}</title>
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e2e0db;
  --accent:#8a3d1f; --accent-ink:#fff; --ok:#2f6b3f; --warn:#8a6a10; --bad:#a32020;
  --okbg:#e8f2ea; --warnbg:#fbf2dc; --badbg:#fae9e9; --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171614; --card:#211f1d; --ink:#f0eeea; --muted:#a6a199; --line:#33302c;
        --accent:#d4753f; --accent-ink:#1a1512; --ok:#7bc08d; --warn:#e0bc63; --bad:#e88b8b;
        --okbg:#1e2b21; --warnbg:#2e2718; --badbg:#2e1c1c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
a{color:var(--accent)}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topwrap{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav a{display:inline-block;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:14px}
nav a:hover{background:var(--bg)}
main{max-width:960px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:28px 0 10px;letter-spacing:-.01em}
p.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;font-size:16px;margin-bottom:4px}
.tile span{color:var(--muted);font-size:13px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
label{display:block;margin:14px 0 4px;font-size:14px;font-weight:550}
label .req{color:var(--bad)}
input,select,textarea{width:100%;padding:11px 12px;font:inherit;color:inherit;background:var(--bg);
  border:1px solid var(--line);border-radius:10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle}
.help{color:var(--muted);font-size:13px;margin-top:4px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
button,.btn{display:inline-block;padding:12px 18px;font:inherit;font-weight:600;border:0;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button.wide{width:100%;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:550;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
td.when{white-space:nowrap}
input[type=file]{padding:9px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.banner{padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
.banner.bad{background:var(--badbg);color:var(--bad)}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);
  padding:4px 10px;border-radius:8px;letter-spacing:.08em;font-weight:650}
</style>
</head>
<body>
{% if user %}
<header class="top"><div class="topwrap">
  <div class="brand">{{ user.name }}<small>{{ "Manager" if user.role.value == "MANAGER" else "Empleado" }}</small></div>
  <nav>
  {% if user.role.value == "MANAGER" %}
    <a href="/manager">Panel</a><a href="/manager/registros">Registros</a><a href="/manager/alertas">Alertas</a>
    <a href="/manager/plantillas">Plantillas</a><a href="/manager/equipo">Equipo</a><a href="/app">Registrar</a>
  {% else %}
    <a href="/app">Registrar</a><a href="/app/mis-registros">Mis registros</a>
  {% endif %}
  </nav>
  <form method="post" action="/logout" style="margin:0"><button class="ghost" style="padding:6px 12px">Salir</button></form>
</div></header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
