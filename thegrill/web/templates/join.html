{% extends "base.html" %}{% block title %}{{ t("join.title") }}{% endblock %}
{% block body %}
<p class="muted"><a href="/">&larr; {{ t("app.title") }}</a></p>
<h1>{{ t("join.title") }}</h1>
<p class="sub">{{ t("join.sub") }}</p>
{% if error %}<div class="banner bad" role="alert" tabindex="-1">{{ error }}</div>{% endif %}
<div class="card">
<form method="post" action="/join">
  <label for="join_code">{{ t("join.code") }}</label>
  <input id="join_code" name="join_code" value="{{ code }}" style="text-transform:uppercase;letter-spacing:.12em"
         required autofocus>
  <label for="name">{{ t("signup.your_name") }}</label>
  <input id="name" name="name" required>
  <label for="email">{{ t("signup.your_email") }}</label>
  <input id="email" name="email" type="email" required>
  <label for="password">{{ t("common.password") }} <span class="muted">({{ t("common.password_hint") }})</span></label>
  <input id="password" name="password" type="password" minlength="8" required>
  <label for="language">{{ t("common.language") }}</label>
  <select id="language" name="language">
    {% for code_, l in languages.items() %}
      <option value="{{ code_ }}" {% if code_ == lang %}selected{% endif %}>{{ l.name }}</option>
    {% endfor %}
  </select>
  <button class="wide" type="submit">{{ t("join.submit") }}</button>
</form>
</div>
<p class="muted"><a href="/login">{{ t("login.have_account") }}</a></p>
{% endblock %}
