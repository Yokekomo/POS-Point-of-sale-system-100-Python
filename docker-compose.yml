# Levanta la plataforma entera: base de datos, aplicación y el que pone el
# HTTPS. Con esto y un dominio ya hay entorno de prueba de verdad.
#
#   cp .env.example .env     # y se rellena
#   docker compose up -d
#   docker compose exec app python -m thegrill.cli --db "$GRILL_DB" crear-dueno \
#       --email tu@correo.com --nombre "Tu nombre" --password "una-clave-larga"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?hace falta una contraseña}
      POSTGRES_DB: carnes
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grill -d carnes"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GRILL_DB: postgresql+psycopg://grill:${POSTGRES_PASSWORD}@db:5432/carnes
      GRILL_DATA_KEY: ${GRILL_DATA_KEY:?hace falta la clave de cifrado}
      GRILL_SMTP_HOST: ${GRILL_SMTP_HOST:-}
      GRILL_SMTP_PORT: ${GRILL_SMTP_PORT:-587}
      GRILL_SMTP_USER: ${GRILL_SMTP_USER:-}
      GRILL_SMTP_PASSWORD: ${GRILL_SMTP_PASSWORD:-}
      GRILL_MAIL_FROM: ${GRILL_MAIL_FROM:-}
      GRILL_MAIL_TO: ${GRILL_MAIL_TO:-}
      # Las dos claves de la pasarela: una comprueba lo que nos manda y la otra
      # firma lo que le mandamos. La segunda es la que para el cobro al cancelar.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Las fotos de las etiquetas viven en disco, no en la base. Sin este
      # volumen se iban con el contenedor: un `docker compose up --build`
      # —o sea, cada actualización— se llevaba por delante todas las fotos
      # de etiqueta de proveedor guardadas hasta entonces. Eso es la prueba
      # de qué lote, qué matadero y qué fecha de sacrificio traía cada
      # pieza, y es justo lo que pide una inspección: no puede depender de
      # que nadie haya vuelto a construir la imagen.
      GRILL_UPLOAD_DIR: /app/subidas
    volumes:
      - fotos:/app/subidas
      # Solo para poder restaurar desde aquí; quien las escribe es `copias`.
      - copias:/copias
    expose:
      - "8000"

  # [01711] La copia de seguridad, todos los días, sin que nadie se acuerde.
  #
  # Va en su propio contenedor y no en una tarea del servidor a propósito: una
  # tarea de `cron` en la máquina de fuera es una cosa más que hay que acordarse
  # de poner al montar cada servidor, y la que no se pone no se echa de menos
  # hasta el día que hace falta. Así la copia viene con el programa.
  #
  # Se lleva la base Y las fotos de las etiquetas, que están en el otro volumen
  # y son la prueba de qué matadero y qué lote traía cada pieza.
  #
  # Y el volumen de las copias está montado también en `app`, para poder
  # restaurar desde el mismo contenedor donde corre el programa:
  #   docker compose exec app sh -c 'python -m thegrill.cli --db "$GRILL_DB" \
  #       restaurar /copias/carnes-AAAAMMDD-HHMMSS.tar.gz --fotos /app/subidas --si'
  copias:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GRILL_DB: postgresql+psycopg://grill:${POSTGRES_PASSWORD}@db:5432/carnes
      GRILL_UPLOAD_DIR: /app/subidas
      # Cuántas se guardan. Una diaria y treinta copias es un mes hacia atrás,
      # que es lo que hace falta para volver de algo que nadie vio el mismo día.
      GUARDAR: ${COPIAS_GUARDAR:-30}
    volumes:
      - fotos:/app/subidas:ro
      - copias:/copias
    entrypoint: ["sh", "-c"]
    # La primera se hace al arrancar y no a las 24 horas: así, si algo está mal
    # configurado, se ve en el primer minuto y no dentro de un día.
    command:
      - |
        while true; do
          python -m thegrill.cli --db "$$GRILL_DB" copia \
            --a /copias --fotos /app/subidas --guardar "$$GUARDAR" || \
            echo "LA COPIA HA FALLADO $$(date -u +%FT%TZ)"
          sleep 86400
        done

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?hace falta el dominio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config

volumes:
  datos-db:
  fotos:
  copias:
  caddy-datos:
  caddy-config:
